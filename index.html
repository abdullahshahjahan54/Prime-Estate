<!doctype html>

    <!-- Structured Data (JSON-LD) for RealEstateAgent & LocalBusiness -->

      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Prime Estate",

      "url": "https://primeestate.vercel.app",
      "telephone": "+92 300 1234567",
      "priceRange": "PKR 5,000,000 - PKR 500,000,000",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Executive Heights, Sector F-7/2",
        "addressLocality": "Islamabad",
        "addressRegion": "ICT",
        "postalCode": "44000",
        "addressCountry": "PK"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 33.7294,
        "longitude": 73.0560
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday"
        ],
        "opens": "09:00",
        "closes": "19:00"
      },
      "sameAs": [
        "https://www.facebook.com/primeestate",
        "https://www.instagram.com/primeestate",

      ]

  <body class="bg-neutral-50 text-neutral-900 font-sans antialiased selection:bg-amber-600 selection:text-white">
